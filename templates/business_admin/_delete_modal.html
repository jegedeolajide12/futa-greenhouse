<!-- ========================== -->
<!-- DELETE CONFIRMATION MODAL -->
<!-- ========================== -->
<div id="deleteModal" class="modal-overlay" style="display: none;">
    <div class="modal-container" style="max-width: 420px;">
        <div class="modal-header" style="border-bottom: 1px solid rgba(239, 68, 68, 0.2);">
            <h2 style="color: var(--accent-red);"><i class="fas fa-exclamation-triangle"></i> Confirm Delete</h2>
            <button class="modal-close" onclick="closeDeleteModal()">&times;</button>
        </div>
        <div class="modal-body">
            <p style="margin-bottom: 0.5rem;">
                Are you sure you want to delete <strong id="deleteItemName"></strong>?
            </p>
            <p style="color: var(--text-muted); font-size: 0.9rem;">
                This action cannot be undone.
            </p>
            <input type="hidden" id="deleteItemId" value="">
            <input type="hidden" id="deleteItemType" value="">
        </div>
        <div class="modal-footer" style="border-top: none; padding-top: 0;">
            <button class="btn-outline" onclick="closeDeleteModal()">Cancel</button>
            <button class="btn-primary" id="confirmDeleteBtn" style="background: var(--accent-red); box-shadow: 0 8px 30px rgba(239, 68, 68, 0.2);">
                <i class="fas fa-trash-alt"></i> Delete
            </button>
        </div>
    </div>
</div>
